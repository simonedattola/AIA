services:
  mongo:
    image: mongo:7
    container_name: aia-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: aia-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: aia_legnano
      JWT_SECRET: change-me-in-production-use-a-long-random-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_HOURS: 24
      ADMIN_EMAIL: admin@aia-legnano.it
      # Override via ADMIN_PASSWORD env in production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-only-change-me}
      ADMIN_NAME: Amministratore
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PUBLIC_API_URL: http://localhost:8000
      UPLOAD_DIR: /app/backend/uploads
      DESIGNATIONS_CRAWL_ALL_HUBS: "false"
      DESIGNATIONS_NATIONAL_HUBS: canc,cand,can5elite,can5,canbs
      DESIGNATIONS_FILTER_SECTION: Legnano
      # Cookie sessionid Instagram (per import completo galleria): vedi Admin o scripts/import_instagram_gallery.py
      INSTAGRAM_SESSION_ID: ""
    volumes:
      - backend-uploads:/app/backend/uploads
      - ./backend/app:/app/backend/app
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    command: ["python", "-m", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
    container_name: aia-frontend
    restart: unless-stopped
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8000
      WDS_SOCKET_PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      # Sorgenti montati: le modifiche al frontend si vedono senza rebuild dell'immagine
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm start"

    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-uploads:
  frontend-node-modules:
