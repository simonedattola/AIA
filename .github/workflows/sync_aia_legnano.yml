name: Sync AIA Legnano
# DISABLED: non committare media binari su git (push fallisce / repo troppo pesante).
# I file vanno su MongoDB GridFS via:
#   python backend/scripts/backfill_uploads_to_gridfs.py
#   python backend/scripts/import_legacy_articles.py
#   python backend/scripts/import_aia_documents.py
#
# Per un sync manuale su disco locale (senza push):
#   python3 backend/scripts/sync_from_legacy_site.py --output-dir=/tmp/aia-static
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digita RUN per eseguire solo lo scrape (nessun commit)"
        required: true
        default: ""

jobs:
  sync-dry:
    if: github.event.inputs.confirm == 'RUN'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 pillow
      - name: Scrape legacy site into /tmp (no git commit)
        run: python3 backend/scripts/sync_from_legacy_site.py --output-dir=/tmp/aia-static
      - name: Summary
        run: |
          echo "Scraped under /tmp/aia-static — non pushato su git."
          find /tmp/aia-static -type f | wc -l
